services:
  db:
    image: mysql:latest
    ports:
      - "3311:3306"
    environment:
      MYSQL_ROOT_PASSWORD: toor
    networks:
      - backend_net

  backend:
    image: tomcat:latest
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - backend_net
      - frontend_net

  frontend:
    image: nginx:latest
    ports:
      - "8082:80"
    depends_on:
      - backend
    networks:
      - frontend_net

networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge