services:
  tomcat:
    image: tomcat:latest
    networks:
    - app_net
    volumes:
      - ./tomcat-root:/usr/local/tomcat/webapps/ROOT:ro

  proxy:
    image: nginx:latest
    ports:
      - "8082:80"
    depends_on:
      - tomcat
    networks:
      - app_net
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  app_net:
    driver: bridge