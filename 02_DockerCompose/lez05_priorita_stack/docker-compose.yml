services:
  db:
    image: mysql:latest
    ports:
      - "3311:3306"
    environment:
      MYSQL_ROOT_PASSWORD: toor

  backend:
    image: tomcat:latest
    ports:
      - "8081:8080"
    depends_on:
      - db

  frontend:
    image: nginx:latest
    ports:
      - "8082:80"
    depends_on:
      - backend